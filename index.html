    <!-- Theme & Language Pre-hydration Script (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var paramTheme = params.get('theme');
          var savedTheme = (paramTheme && ['light', 'dark', 'system'].indexOf(paramTheme) !== -1)
            ? paramTheme
            : (localStorage.getItem('reazul_portfolio_theme') || 'system');
          
          var isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          var paramLang = params.get('lang');
          var savedLang = (paramLang && ['en', 'bn'].indexOf(paramLang) !== -1)
            ? paramLang
            : (localStorage.getItem('reazul_portfolio_lang') || 'en');
          document.documentElement.setAttribute('lang', savedLang);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
